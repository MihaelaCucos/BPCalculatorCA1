# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release

  unit-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Run unit tests
      run: dotnet test BPCalculator.Tests/BPCalculator.Tests.csproj --configuration Release --filter "TestCategory=Unit"

  integration-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Run integration tests
      run: dotnet test BPCalculator.Tests/BPCalculator.Tests.csproj --configuration Release --filter "TestCategory=Integration"

  acceptance-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Build acceptance tests
      run: dotnet build BPCalculator.AcceptanceTests/BPCalculator.AcceptanceTests.csproj --configuration Release
    - uses: browser-actions/setup-chrome@v2
      id: setup-chrome
    - name: Run Gherkin acceptance tests
      env:
        CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
      run: dotnet test BPCalculator.AcceptanceTests/BPCalculator.AcceptanceTests.csproj --configuration Release --no-build

  performance-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Run production-mode performance baseline
      run: dotnet test BPCalculator.PerformanceTests/BPCalculator.PerformanceTests.csproj --configuration Release

  k6-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - uses: grafana/setup-k6-action@v1
      with:
        k6-version: '2.4.0'
    - name: Build calculator
      run: dotnet build BPCalculator/BPCalculator.csproj --configuration Release
    - name: Run k6 profiles against local Production host
      run: |
        set -euo pipefail
        ASPNETCORE_ENVIRONMENT=Production ASPNETCORE_URLS=http://127.0.0.1:5050 \
          dotnet BPCalculator/bin/Release/net9.0/BPCalculator.dll > app.log 2>&1 &
        app_pid=$!
        trap 'kill "$app_pid" 2>/dev/null || true' EXIT

        for attempt in {1..30}; do
          if curl --fail --silent --output /dev/null http://127.0.0.1:5050/; then
            break
          fi
          sleep 1
        done
        curl --fail --silent --show-error --output /dev/null http://127.0.0.1:5050/

        k6 run --env BASE_URL=http://127.0.0.1:5050 k6/baseline.js
        k6 run --env BASE_URL=http://127.0.0.1:5050 k6/load.js
        k6 run --env BASE_URL=http://127.0.0.1:5050 k6/spike.js
